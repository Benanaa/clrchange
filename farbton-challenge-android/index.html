<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Farbton Challenge</title><style>
:root{color-scheme:dark;font-family:system-ui;background:#101827;color:#f7f8fc}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px 14px}main{width:min(100%,470px)}header{text-align:center;margin:8px 0 22px}h1{font-size:2rem;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.stat,.game{background:#1b2739;border:1px solid #2a3850;border-radius:18px}.stat{padding:12px 8px;text-align:center}.stat span{display:block;color:#aab5c8;font-size:.68rem}.stat strong{font-size:1.65rem}.game{padding:19px}h2{text-align:center;font-size:1.15rem;margin:0 0 5px}.hint{text-align:center;color:#aab5c8;font-size:.84rem;margin:0 0 18px}#board{display:grid;gap:8px}.tile{border:0;border-radius:9px;aspect-ratio:1;width:100%;cursor:pointer;touch-action:manipulation}#feedback{min-height:26px;text-align:center;margin:16px 0 0;font-weight:650}#feedback.good{color:#64dfa1}#feedback.bad{color:#ff9a9a}.reset{display:none;width:100%;margin-top:17px;border:0;color:#101827;background:#78a9ff;padding:13px;border-radius:13px;font:inherit;font-weight:750}.reset.visible{display:block}.progress-label{display:flex;justify-content:space-between;color:#aab5c8;font-size:.78rem;margin:17px 1px 7px}.track{height:7px;background:#303d52;border-radius:99px;overflow:hidden}#progress{height:100%;background:#78a9ff}footer{color:#7f8da4;text-align:center;font-size:.72rem;margin:15px 0}</style></head><body><main><header><h1>🎨 Farbton Challenge</h1><p>WIE GUT SIND DEINE AUGEN?</p></header><section class="stats"><div class="stat"><span>PUNKTE</span><strong id="score">0</strong></div><div class="stat"><span>LEVEL</span><strong id="level">1</strong></div><div class="stat"><span>REKORD</span><strong id="best">0</strong></div></section><section class="game"><h2>Welches Feld ist anders?</h2><p class="hint">Tippe auf das Viereck mit dem abweichenden Farbton.</p><div id="board"></div><p id="feedback" role="status">Finde das Feld mit dem anderen Farbton!</p><button class="reset" id="reset">↻ Nochmal starten</button></section><div class="progress-label"><span>Schwierigkeit</span><span id="progressText"></span></div><div class="track"><div id="progress"></div></div><footer>Verschiedene Farben · langsame Steigerung · maximal 7 × 7 Felder</footer></main><script>
(()=>{const palettes=[[210,55,65],[55,165,85],[235,190,45],[145,85,195],[235,125,45],[40,175,175],[220,100,155],[115,135,185],[190,110,75],[105,165,125],[175,145,65],[100,125,205]];let level=0,score=0,board=[],over=false;let best=Number(localStorage.getItem('farbton-best')||0);const $=id=>document.getElementById(id),hex=n=>Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,'0'),color=a=>'#'+a.map(hex).join('');function round(){const size=Math.min(7,3+Math.floor(level/5)),odd=Math.floor(Math.random()*size*size),p=palettes[Math.floor(Math.random()*palettes.length)],delta=Math.max(12,Math.round(32*Math.pow(.99,level))),base=color(p),alt=color(p.map(v=>v>180?v-delta:v+delta));board=Array.from({length:size*size},(_,i)=>({odd:i===odd,color:i===odd?alt:base}));$('board').style.gridTemplateColumns=`repeat(${size},minmax(0,1fr))`;$('board').replaceChildren();board.forEach((t,i)=>{const b=document.createElement('button');b.className='tile';b.style.background=t.color;b.setAttribute('aria-label','Farbfeld '+(i+1));b.onclick=()=>pick(i);$('board').append(b)});$('score').textContent=score;$('level').textContent=level+1;$('best').textContent=best;$('progress').style.width=((level%5+1)*20)+'%';$('progressText').textContent=size===7?'Maximales Spielfeld: 7 × 7':`Neue Felder in ${5-level%5} Level`;$('reset').classList.remove('visible');over=false}function pick(i){if(over)return;if(board[i].odd){score++;level++;if(score>best){best=score;localStorage.setItem('farbton-best',best)}$('feedback').textContent='Richtig! +1 Punkt 🎉';$('feedback').className='good';round()}else{over=true;$('feedback').textContent='Leider falsch! Das Spiel ist vorbei.';$('feedback').className='bad';document.querySelectorAll('.tile').forEach(x=>x.disabled=true);$('reset').classList.add('visible')}}$('reset').onclick=()=>{level=0;score=0;$('feedback').textContent='Finde das Feld mit dem anderen Farbton!';$('feedback').className='';round()};round();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))})();
</script></body></html>
